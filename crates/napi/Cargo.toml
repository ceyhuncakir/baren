[package]
name = "baren-napi"
description = "Node-API bindings exposing baren-core to the Electron main process."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "baren_napi"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
baren-core.workspace = true
napi.workspace = true
napi-derive.workspace = true

[build-dependencies]
napi-build.workspace = true

# Windows GNU builds (cross-compiled from Linux) look up N-API in the host process at runtime,
# as MSVC builds always do: Electron exports it from its executable, not from a libnode.dll.
[target.'cfg(all(windows, target_env = "gnu"))'.dependencies]
napi = { workspace = true, features = ["dyn-symbols"] }
