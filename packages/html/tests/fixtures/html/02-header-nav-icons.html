<header layer-name="Header" style="display: flex; align-items: center; justify-content: space-between; height: 64px; padding: 0 32px; background-color: var(--color-background); border-bottom: 1px solid var(--color-border); flex-shrink: 0;">
  <div layer-name="Brand" style="display: flex; align-items: center; gap: 10px;">
    <svg layer-name="Logo mark" width="24" height="24" viewBox="0 0 24 24" fill="none"><rect width="24" height="24" rx="6" fill="var(--color-primary)"/><path d="M7 12h10M12 7v10" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/></svg>
    <span style="font-family: Inter; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; color: var(--color-foreground);">Northwind</span>
  </div>
  <nav layer-name="Nav" style="display: flex; align-items: center; gap: 28px;">
    <a href="#" style="font-family: Inter; font-size: 14px; color: var(--color-foreground);">Product</a>
    <a href="#" style="font-family: Inter; font-size: 14px; color: var(--color-foreground-muted);">Pricing</a>
    <a href="#" style="font-family: Inter; font-size: 14px; color: var(--color-foreground-muted);">Docs</a>
  </nav>
  <div layer-name="Actions" style="display: flex; align-items: center; gap: 12px;">
    <svg layer-name="Search" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <button style="display: flex; align-items: center; height: 32px; padding: 0 14px; border-radius: var(--radius-md); background-color: var(--color-primary); color: var(--color-primary-foreground); font-family: Inter; font-size: 13px; font-weight: 500;">Sign up</button>
  </div>
</header>
