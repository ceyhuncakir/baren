<!-- A card built the way the guide asks: the shell first, then each row in its own call. -->
<div layer-name="Settings card" style="display: flex; flex-direction: column; width: 420px; padding: 8px 0; background-color: var(--color-background); border: 1px solid var(--color-border); border-radius: var(--radius-lg); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);"></div>
<!-- next: $0 -->
<div layer-name="Card header" style="display: flex; flex-direction: column; gap: 4px; padding: 12px 20px 16px;">
  <h2 style="font-family: Inter; font-size: 16px; font-weight: 600; line-height: 22px; color: var(--color-foreground);">Notifications</h2>
  <p style="font-family: Inter; font-size: 13px; line-height: 18px; color: var(--color-foreground-muted);">Choose what reaches your inbox.</p>
</div>
<!-- next: $0 -->
<div layer-name="Row" style="display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 20px; border-top: 1px solid var(--color-border);">
  <span style="font-family: Inter; font-size: 14px; line-height: 20px; color: var(--color-foreground);">Comments on my files</span>
  <div layer-name="Switch" style="display: flex; align-items: center; justify-content: flex-end; width: 32px; height: 18px; padding: 2px; border-radius: 9999px; background-color: var(--color-primary); flex-shrink: 0;">
    <div layer-name="Knob" style="width: 14px; height: 14px; border-radius: 50%; background-color: #FFFFFF;"></div>
  </div>
</div>
