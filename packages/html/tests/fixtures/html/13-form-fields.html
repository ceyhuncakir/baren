<form layer-name="Sign in" style="display: flex; flex-direction: column; gap: 16px; width: 360px; padding: 32px; border-radius: 12px; background: #FFFFFF; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);">
  <label style="display: flex; flex-direction: column; gap: 6px;">
    <span style="font-family: Inter; font-size: 13px; font-weight: 500; color: var(--color-foreground);">Email</span>
    <input type="email" placeholder="you@example.com" style="display: flex; align-items: center; height: 36px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--color-border); font-family: Inter; font-size: 14px; color: var(--color-foreground);">
  </label>
  <select style="height: 36px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--color-border);"><option>Personal</option><option selected>Work</option></select>
  <button type="submit" style="height: 40px; border-radius: 8px; background: var(--color-primary); color: #FFFFFF; font-family: Inter; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center;">Continue</button>
  <hr>
  <p style="font-family: Inter; font-size: 12px; text-align: center; color: var(--color-foreground-subtle);">No account? <a href="#" style="color: var(--color-foreground);">Create one</a></p>
</form>
