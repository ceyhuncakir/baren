<div layer-name="Banner" style="--banner-accent: var(--color-primary); display: flex; align-items: center; gap: 12px; padding: var(--spacing-3) var(--spacing-4); border-radius: var(--radius-md); background-color: color-mix(in srgb, var(--banner-accent) 8%, transparent); border: 1px solid color-mix(in srgb, var(--banner-accent) 24%, transparent);">
  <div layer-name="Dot" style="width: 8px; height: 8px; border-radius: var(--radius-full); background-color: var(--banner-accent); flex-shrink: 0;"></div>
  <p style="font-family: var(--font-sans); font-size: var(--text-sm); line-height: var(--leading-sm); color: var(--color-foreground); flex: 1;">Your trial ends in 3 days.</p>
  <a style="font-family: var(--font-sans); font-size: var(--text-sm); font-weight: var(--font-weight-semibold); color: var(--color-brand-accent);">Upgrade</a>
</div>
